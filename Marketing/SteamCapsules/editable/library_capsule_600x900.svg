<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="900" viewBox="0 0 600 900">
  <!-- REEF RUN capsule, layered: in-engine art plate / soft teal scrim behind the title / title (transparent PNG).
       Move or scale the title layer freely. The shipped PNG is made by compose_capsules.py (which also adds a
       light vignette); the title itself is generated by reefrun_gametitle.py (style "M3"). -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90.0"/></filter>
  </defs>
  <image id="plate" x="0" y="0" width="600" height="900" xlink:href="../plates/library_capsule_600x900.png" href="../plates/library_capsule_600x900.png"/>
  <ellipse id="title-scrim" cx="300.0" cy="558.0" rx="204.0" ry="198.0" fill="#062c40" fill-opacity="0.40" filter="url(#soft)"/>
  <image id="title" x="126" y="500" width="348" height="117" xlink:href="../master/title_reefrun_4773x1600.png" href="../master/title_reefrun_4773x1600.png"/>
</svg>
