<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- REEF RUN capsule, layered: in-engine art plate / soft teal scrim behind the title / title (transparent PNG).
       Move or scale the title layer freely. The shipped PNG is made by compose_capsules.py (which also adds a
       light vignette); the title itself is generated by reefrun_gametitle.py (style "M3"). -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="216.0"/></filter>
  </defs>
  <image id="plate" x="0" y="0" width="3840" height="2160" xlink:href="../plates/master_keyart_3840x2160.png" href="../plates/master_keyart_3840x2160.png"/>
  <ellipse id="title-scrim" cx="1920.0" cy="1252.8" rx="1305.6" ry="475.2" fill="#062c40" fill-opacity="0.40" filter="url(#soft)"/>
  <image id="title" x="806" y="879" width="2227" height="747" xlink:href="../master/title_reefrun_4773x1600.png" href="../master/title_reefrun_4773x1600.png"/>
</svg>
