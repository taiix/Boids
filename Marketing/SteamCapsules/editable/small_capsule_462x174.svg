<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="462" height="174" viewBox="0 0 462 174">
  <!-- REEF RUN capsule, layered: in-engine art plate / soft teal scrim behind the title / title (transparent PNG).
       Move or scale the title layer freely. The shipped PNG is made by compose_capsules.py (which also adds a
       light vignette); the title itself is generated by reefrun_gametitle.py (style "M3"). -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="17.4"/></filter>
  </defs>
  <image id="plate" x="0" y="0" width="462" height="174" xlink:href="../plates/small_capsule_462x174.png" href="../plates/small_capsule_462x174.png"/>
  <ellipse id="title-scrim" cx="231.0" cy="87.0" rx="157.1" ry="38.3" fill="#062c40" fill-opacity="0.40" filter="url(#soft)"/>
  <image id="title" x="97" y="42" width="268" height="90" xlink:href="../master/title_reefrun_4773x1600.png" href="../master/title_reefrun_4773x1600.png"/>
</svg>
