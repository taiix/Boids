<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="748" height="896" viewBox="0 0 748 896">
  <!-- REEF RUN capsule, layered: in-engine art plate / soft teal scrim behind the title / title (transparent PNG).
       Move or scale the title layer freely. The shipped PNG is made by compose_capsules.py (which also adds a
       light vignette); the title itself is generated by reefrun_gametitle.py (style "M3"). -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="89.6"/></filter>
  </defs>
  <image id="plate" x="0" y="0" width="748" height="896" xlink:href="../plates/vertical_capsule_748x896.png" href="../plates/vertical_capsule_748x896.png"/>
  <ellipse id="title-scrim" cx="374.0" cy="555.5" rx="254.3" ry="197.1" fill="#062c40" fill-opacity="0.40" filter="url(#soft)"/>
  <image id="title" x="157" y="483" width="434" height="145" xlink:href="../master/title_reefrun_4773x1600.png" href="../master/title_reefrun_4773x1600.png"/>
</svg>
