<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="430" viewBox="0 0 920 430">
  <!-- REEF RUN capsule, layered: in-engine art plate / soft teal scrim behind the title / title (transparent PNG).
       Move or scale the title layer freely. The shipped PNG is made by compose_capsules.py (which also adds a
       light vignette); the title itself is generated by reefrun_gametitle.py (style "M3"). -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="43.0"/></filter>
  </defs>
  <image id="plate" x="0" y="0" width="920" height="430" xlink:href="../plates/header_capsule_920x430.png" href="../plates/header_capsule_920x430.png"/>
  <ellipse id="title-scrim" cx="460.0" cy="258.0" rx="312.8" ry="94.6" fill="#062c40" fill-opacity="0.40" filter="url(#soft)"/>
  <image id="title" x="193" y="168" width="534" height="179" xlink:href="../master/title_reefrun_4773x1600.png" href="../master/title_reefrun_4773x1600.png"/>
</svg>
