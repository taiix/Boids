<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="900" viewBox="0 0 600 900">
  <!-- REEF RUN capsule layout. Layers: in-engine art plate, navy title scrim, logotype (live text in logo_wide.svg).
       The PNG export is made by compose_capsules.py, which also adds a soft vignette. -->
  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="0.42">
      <stop offset="0" stop-color="#051729" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#051729" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image id="plate" x="0" y="0" width="600" height="900" xlink:href="../plates/library_capsule_600x900.png" href="../plates/library_capsule_600x900.png"/>
  <rect id="title-scrim" x="0" y="0" width="600" height="900" fill="url(#scrim)"/>
  <image id="logo" x="69" y="40" width="462" height="202" xlink:href="logo_wide.svg" href="logo_wide.svg"/>
</svg>
