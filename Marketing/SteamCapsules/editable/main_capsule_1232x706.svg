<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1232" height="706" viewBox="0 0 1232 706">
  <!-- REEF RUN capsule layout. Layers: in-engine art plate, navy title scrim, logotype (live text in logo_wide.svg).
       The PNG export is made by compose_capsules.py, which also adds a soft vignette. -->
  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="0.6" y2="0.6">
      <stop offset="0" stop-color="#051729" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#051729" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image id="plate" x="0" y="0" width="1232" height="706" xlink:href="../plates/main_capsule_1232x706.png" href="../plates/main_capsule_1232x706.png"/>
  <rect id="title-scrim" x="0" y="0" width="1232" height="706" fill="url(#scrim)"/>
  <image id="logo" x="55" y="49" width="484" height="212" xlink:href="logo_wide.svg" href="logo_wide.svg"/>
</svg>
