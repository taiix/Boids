<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1232" height="706" viewBox="0 0 1232 706">
  <!-- REEF RUN capsule, layered: in-engine art plate / soft teal scrim behind the title / title (transparent PNG).
       Move or scale the title layer freely. The shipped PNG is made by compose_capsules.py (which also adds a
       light vignette); the title itself is generated by reefrun_gametitle.py (style "M3"). -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70.6"/></filter>
  </defs>
  <image id="plate" x="0" y="0" width="1232" height="706" xlink:href="../plates/main_capsule_1232x706.png" href="../plates/main_capsule_1232x706.png"/>
  <ellipse id="title-scrim" cx="616.0" cy="409.5" rx="418.9" ry="155.3" fill="#062c40" fill-opacity="0.40" filter="url(#soft)"/>
  <image id="title" x="258" y="289" width="715" height="240" xlink:href="../master/title_reefrun_4773x1600.png" href="../master/title_reefrun_4773x1600.png"/>
</svg>
